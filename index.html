<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CIMD demo</title>
  <style>
    body {
      font-family: ui-sans-serif, system-ui, sans-serif;
      max-width: 36rem;
      margin: 3rem auto;
      padding: 0 1rem;
      line-height: 1.5;
      color: #18181b;
    }
    p { color: #3f3f46; }
    code {
      font-size: 0.9em;
      background: #f4f4f5;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }
    button {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.65rem 1.1rem;
      background: #18181b;
      color: #fff;
      border: 0;
      border-radius: 6px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>CIMD demo</h1>
  <p>
    Static metadata host for Client ID Metadata Document demos against cidaas nightly.
    Serves <code>client.json</code> as the OAuth <code>client_id</code>.
  </p>
  <button type="button" id="start">Start authorize</button>

  <script type="module">
    const ISSUER = 'https://kube-nightlybuild-dev.cidaas.de';
    const CLIENT_ID = 'https://thegenericcoder.github.io/demo-cimd-app/client.json';
    const REDIRECT_URI = 'https://thegenericcoder.github.io/demo-cimd-app/callback.html';
    const PKCE_KEY = 'cimd-demo-pkce';
    const STATE = 'cimd-demo';

    function b64url(bytes) {
      let s = '';
      for (const b of bytes) s += String.fromCharCode(b);
      return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function pkceChallenge() {
      const verifierBytes = crypto.getRandomValues(new Uint8Array(32));
      const verifier = b64url(verifierBytes);
      const digest = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(verifier),
      );
      return { verifier, challenge: b64url(new Uint8Array(digest)) };
    }

    document.getElementById('start').addEventListener('click', async () => {
      const { verifier, challenge } = await pkceChallenge();
      sessionStorage.setItem(
        PKCE_KEY,
        JSON.stringify({ verifier, state: STATE, clientId: CLIENT_ID, redirectUri: REDIRECT_URI, issuer: ISSUER }),
      );

      const authz = new URL(`${ISSUER}/authz-srv/authz`);
      authz.searchParams.set('client_id', CLIENT_ID);
      authz.searchParams.set('response_type', 'code');
      authz.searchParams.set('redirect_uri', REDIRECT_URI);
      authz.searchParams.set('scope', 'openid profile email');
      authz.searchParams.set('code_challenge', challenge);
      authz.searchParams.set('code_challenge_method', 'S256');
      authz.searchParams.set('state', STATE);
      window.location.href = authz.toString();
    });
  </script>
</body>
</html>
